syntax = "proto3";

package compute.v1;

option go_package = "coordinator/pkg/pb";

import "worker.proto";

message SubmitJobRequest {
  string container_image = 1;
  repeated string command = 2;
  ResourceSpec required_resources = 3;
  map<string, string> environment = 4;
  int32 max_runtime_seconds = 5;
  JobSchema job = 6;
  string artifact_url = 7;
  string artifact_sha256 = 8;
  // Max assignment attempts before the job is parked as DEAD (0 = server default).
  int32 max_attempts = 9;
  // Submitting user, used for per-user concurrency limits and fairness.
  string user = 10;
  // Run on two workers and compare output hashes (untrusted-worker mitigation).
  bool verify = 11;
  // Only run on workers providing at least this isolation: "" (any) or "gvisor".
  string required_isolation = 12;
  // Hosts the job needs to reach (for example "pypi.org"). Off by default: jobs get no network.
  // Honoured only by workers whose contributor allows network jobs and lists the host; the
  // worker's filtering proxy still refuses private, loopback and metadata addresses.
  repeated string network_hosts = 13;
  // Placement requirements (all optional; 0 / empty = no requirement).
  int32 min_disk_mb = 14;
  string os = 15;              // "linux", "darwin", "windows"
  string arch = 16;            // "amd64", "arm64"
  repeated string labels = 17; // "key=value": the worker must carry every one
}

message SubmitJobResponse {
  JobID job_id = 1;
  Status status = 2;
  JobLifecycleStatus job_status = 3;
}

message GetJobStatusRequest {
  JobID job_id = 1;
}

message GetJobStatusResponse {
  Status status = 1;
  string assigned_worker_id = 2;
  int64 updated_at_unix = 3;
  AssignmentSchema assignment = 4;
  JobLifecycleStatus job_status = 5;
  int32 attempt = 6;
  int32 max_attempts = 7;
  string last_failure = 8;
  int64 queue_seq = 9;
  // For jobs submitted with verify=true: "pending", "match", "mismatch", "timeout" or "unavailable".
  string verification = 10;
  // The most recent output of a running job (last few KB of stdout+stderr), refreshed with every worker heartbeat.
  // Untrusted job output: clients must not pass it to a terminal unsanitised.
  string log_tail = 11;
}

message ListJobsRequest {
  int32 limit = 1;   // newest first; default 50, at most 200
  Status status = 2; // optional filter (STATUS_UNSPECIFIED = all)
}

message JobSummary {
  JobID job_id = 1;
  Status status = 2;
  string assigned_worker_id = 3;
  int32 attempt = 4;
  int32 max_attempts = 5;
  int64 created_at_unix = 6;
  string container_image = 7;
  string user = 8;
  int64 queue_seq = 9;
  string last_failure = 10;
}

message ListJobsResponse {
  repeated JobSummary jobs = 1;
}

message CancelJobRequest {
  JobID job_id = 1;
}

message CancelJobResponse {
  // "ok", or "duplicate" if the job had already reached a terminal state.
  string disposition = 1;
}

message GetJobResultRequest {
  JobID job_id = 1;
}

message GetJobResultResponse {
  Status status = 1;
  bool result_available = 2;
  Result result = 3;
  JobResultSchema result_schema = 4;
  JobLifecycleStatus job_status = 5;
}

// Cluster-visible summary of a registered worker.
message WorkerInfo {
  WorkerID worker_id = 1;
  ResourceSpec resources = 2;
  string version = 3;
  bool alive = 4;
  int64 registered_at_unix = 5;
  int64 last_heartbeat_unix = 6;
  repeated JobID running_jobs = 7;
  // Effective overload as seen by the scheduler (worker flag OR coordinator-derived).
  bool overloaded = 8;
  bool draining = 9;
  ResourceUsage usage = 10;
  string isolation = 11;
  bool allows_network = 12;
  string os = 13;
  string arch = 14;
  repeated string labels = 15;
  double reliability = 16;      // 0-1, decayed success rate of recent jobs
  int32 preference = 17;
}

message ListWorkersRequest {}

message ListWorkersResponse {
  repeated WorkerInfo workers = 1;
}

// One worker's evaluation for a job: why it was rejected, or how it scored.
message WorkerEvaluation {
  WorkerID worker_id = 1;
  bool eligible = 2;
  repeated string reasons = 3;         // why it cannot run the job (empty if eligible)
  double score = 4;                    // total weighted score (eligible workers only)
  map<string, double> parts = 5;       // weighted contribution of each scoring component
  bool chosen = 6;
  bool busy = 7;                       // eligible but has no free slot right now
}

message ExplainJobRequest {
  JobID job_id = 1;
}

message ExplainJobResponse {
  JobID job_id = 1;
  Status status = 2;
  string summary = 3;
  // True if this is the record made when the job was assigned; false if it is a live evaluation
  // of the current cluster for a job that is still waiting.
  bool recorded = 4;
  int64 evaluated_at_unix = 5;
  string assigned_worker_id = 6;
  repeated WorkerEvaluation evaluations = 7;
  map<string, double> weights = 8;
}

service ClientService {
  // Shows why each worker was chosen or rejected for a job.
  rpc ExplainJob(ExplainJobRequest) returns (ExplainJobResponse);

  // Recent jobs, newest first (what a UI or `computehive jobs` shows).
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse);

  // Cancels a job in any non-terminal state.
  rpc CancelJob(CancelJobRequest) returns (CancelJobResponse);

  // Lists registered workers with liveness and assigned jobs.
  rpc ListWorkers(ListWorkersRequest) returns (ListWorkersResponse);

  // Submits a new compute job to the coordinator.
  rpc SubmitJob(SubmitJobRequest) returns (SubmitJobResponse);

  // Returns current state for a submitted job.
  rpc GetJobStatus(GetJobStatusRequest) returns (GetJobStatusResponse);

  // Returns final result when available.
  rpc GetJobResult(GetJobResultRequest) returns (GetJobResultResponse);
}
