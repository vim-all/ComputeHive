syntax = "proto3";

package compute.v1;

option go_package = "coordinator/pkg/pb";

import "worker.proto";

message SubmitJobRequest {
  string container_image = 1;
  repeated string command = 2;
  ResourceSpec required_resources = 3;
  map<string, string> environment = 4;
  int32 max_runtime_seconds = 5;
  JobSchema job = 6;
  string artifact_url = 7;
  string artifact_sha256 = 8;
  // Max assignment attempts before the job is parked as DEAD (0 = server default).
  int32 max_attempts = 9;
  // Submitting user, used for per-user concurrency limits and fairness.
  string user = 10;
  // Run on two workers and compare output hashes (untrusted-worker mitigation).
  bool verify = 11;
}

message SubmitJobResponse {
  JobID job_id = 1;
  Status status = 2;
  JobLifecycleStatus job_status = 3;
}

message GetJobStatusRequest {
  JobID job_id = 1;
}

message GetJobStatusResponse {
  Status status = 1;
  string assigned_worker_id = 2;
  int64 updated_at_unix = 3;
  AssignmentSchema assignment = 4;
  JobLifecycleStatus job_status = 5;
  int32 attempt = 6;
  int32 max_attempts = 7;
  string last_failure = 8;
  int64 queue_seq = 9;
}

message CancelJobRequest {
  JobID job_id = 1;
}

message CancelJobResponse {
  // "ok", or "duplicate" if the job had already reached a terminal state.
  string disposition = 1;
}

message GetJobResultRequest {
  JobID job_id = 1;
}

message GetJobResultResponse {
  Status status = 1;
  bool result_available = 2;
  Result result = 3;
  JobResultSchema result_schema = 4;
  JobLifecycleStatus job_status = 5;
}

// Cluster-visible summary of a registered worker.
message WorkerInfo {
  WorkerID worker_id = 1;
  ResourceSpec resources = 2;
  string version = 3;
  bool alive = 4;
  int64 registered_at_unix = 5;
  int64 last_heartbeat_unix = 6;
  repeated JobID running_jobs = 7;
}

message ListWorkersRequest {}

message ListWorkersResponse {
  repeated WorkerInfo workers = 1;
}

service ClientService {
  // Cancels a job in any non-terminal state.
  rpc CancelJob(CancelJobRequest) returns (CancelJobResponse);

  // Lists registered workers with liveness and assigned jobs.
  rpc ListWorkers(ListWorkersRequest) returns (ListWorkersResponse);

  // Submits a new compute job to the coordinator.
  rpc SubmitJob(SubmitJobRequest) returns (SubmitJobResponse);

  // Returns current state for a submitted job.
  rpc GetJobStatus(GetJobStatusRequest) returns (GetJobStatusResponse);

  // Returns final result when available.
  rpc GetJobResult(GetJobResultRequest) returns (GetJobResultResponse);
}
