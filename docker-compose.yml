# Local cluster: Redis (AOF) + coordinator + 2 workers + Prometheus + Grafana.
# Bring it up with `make up` (it exports DOCKER_GID and creates the shared work dir).
name: computehive

x-worker: &worker
  build:
    context: .
    dockerfile: worker/Dockerfile
  restart: unless-stopped
  depends_on:
    coordinator:
      condition: service_healthy
  # The worker is trusted infrastructure: it drives the host Docker daemon to run
  # *untrusted* jobs. Jobs themselves never get the socket.
  group_add: ["${DOCKER_GID:-999}"]
  volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    # Same path inside and outside: job output dirs are bind-mounted by the host
    # daemon, so the worker must see them at the host path.
    - ${COMPUTEHIVE_WORK_DIR:-/tmp/computehive-work}:${COMPUTEHIVE_WORK_DIR:-/tmp/computehive-work}
  environment: &worker-env
    COORDINATOR_ADDR: coordinator:50051
    COORDINATOR_HTTP_URL: http://coordinator:8080
    TMPDIR: ${COMPUTEHIVE_WORK_DIR:-/tmp/computehive-work}
    HEARTBEAT_INTERVAL: 2s

services:
  redis:
    image: redis:7-alpine
    # AOF on (fsync every second); RDB snapshots off so the AOF is the single source of truth.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--save", ""]
    volumes:
      - redis-data:/data
    ports:
      # Ephemeral loopback port (no clashes); find it with `docker compose port redis 6379`.
      - "127.0.0.1::6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  coordinator:
    build:
      context: .
      dockerfile: coordinator/Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_ADDR: redis:6379
    volumes:
      - artifacts:/data/artifacts
    ports:
      - "50051:50051"
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 2s
      timeout: 2s
      retries: 15

  worker-1:
    <<: *worker
    environment:
      <<: *worker-env
      WORKER_ID: worker-1

  worker-2:
    <<: *worker
    environment:
      <<: *worker-env
      WORKER_ID: worker-2

  # Demo of the resource-safety rule (scripts/pressure-cluster.sh): a worker whose RAM limit is
  # 1%, i.e. permanently overloaded. It must never be assigned a job. Not started by default.
  worker-hot:
    <<: *worker
    profiles: ["pressure"]
    environment:
      <<: *worker-env
      WORKER_ID: worker-hot
      RAM_LIMIT_PERCENT: "1"
      RELEASE_PERCENT: "0.5"

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

volumes:
  redis-data:
  artifacts:
