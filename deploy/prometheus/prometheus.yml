# The coordinator's /metrics requires the API token and is served over TLS (same listener as the artifact
# store). `make up` mounts the token and the cluster CA from .computehive/ into /etc/prometheus/secrets.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: coordinator
    scheme: https
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/api.token
    tls_config:
      ca_file: /etc/prometheus/secrets/ca.crt
      server_name: coordinator
    static_configs:
      - targets: ["coordinator:8080"]
